name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run coverage
      - name: Sustained workload regression
        run: npm run soak -- 30000
        timeout-minutes: 2
      - name: Save sustained workload report
        if: ${{ always() && hashFiles('work/soak-latest.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: soak-${{ matrix.os }}
          path: work/soak-latest.json
          retention-days: 14
          if-no-files-found: error
